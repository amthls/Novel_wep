services:
  # ============================================================================
  # 1. Database Service: PostgreSQL 16
  # ============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: novel_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-novel_platform}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/database.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-novel_platform}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - novel_network

  # ============================================================================
  # 2. Backend RESTful API Service (Node.js / Express / Prisma)
  # ============================================================================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: novel_backend
    restart: unless-stopped
    ports:
      - "${PORT:-5000}:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-novel_platform}?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ${JWT_SECRET:-super_secret_jwt_novelhub_key_2026_x89a@!secure}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - novel_network

  # ============================================================================
  # 3. Frontend Service (Next.js 14 App Router)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: novel_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:5000/api/v1
      API_URL: http://backend:5000/api/v1
    volumes:
      - ./uploads:/app/public/uploads
    depends_on:
      - backend
    networks:
      - novel_network

  # ============================================================================
  # Optional: pgAdmin 4 for Database Web GUI Management
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: novel_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@novelhub.vn}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      - postgres
    networks:
      - novel_network
    profiles:
      - tools

volumes:
  postgres_data:
    driver: local

networks:
  novel_network:
    driver: bridge
